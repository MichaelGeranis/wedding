[project]
name = "wedding-api"
version = "0.1.0"
description = "Wedding RSVP API"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "sqlalchemy>=2.1.8",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.33",
    "slowapi>=0.1.10",
    "isort>=9.0.2",
    "greenlet>=3.5.6",
    "types-python-jose>=3.5.0.20260408",
    "httpx>=0.28.1",
    "qrcode[pil]>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.1",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "types-qrcode>=8.2.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wedding_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 200
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F811"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "slowapi.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
